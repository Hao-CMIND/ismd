[workspace]
resolver = "2"
members = [
  "crates/pug_ast",
  "crates/pug_error",
  "crates/pug_js",
  "crates/pug_lexer",
  "crates/pug_strip_comments",
  "crates/pug_parser",
  "crates/pug_walk",
  "crates/pug_load",
  "crates/pug_linker",
  "crates/pug_attrs",
  "crates/pug_code_gen",
  "crates/pug_runtime",
  "crates/pug_compiler",
  "crates/pug_plugin_abi",
  "crates/pug_napi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
libloading = "0.9.0"
oxc = { version = "=0.157.0", features = ["semantic", "ast_visit", "codegen", "regular_expression"] }
napi = { version = "=3.16.1", features = ["napi8", "serde-json", "compat-mode"] }
napi-derive = { version = "=3.7.0", features = ["compat-mode"] }
napi-build = "=2.6.0"

pug_plugin_abi = { path = "crates/pug_plugin_abi" }
pug_ast = { path = "crates/pug_ast" }
pug_error = { path = "crates/pug_error" }
pug_js = { path = "crates/pug_js" }
pug_lexer = { path = "crates/pug_lexer" }
pug_strip_comments = { path = "crates/pug_strip_comments" }
pug_parser = { path = "crates/pug_parser" }
pug_walk = { path = "crates/pug_walk" }
pug_load = { path = "crates/pug_load" }
pug_linker = { path = "crates/pug_linker" }
pug_attrs = { path = "crates/pug_attrs" }
pug_code_gen = { path = "crates/pug_code_gen" }
pug_runtime = { path = "crates/pug_runtime" }
pug_compiler = { path = "crates/pug_compiler" }
